spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/libravault}
    username: ${SPRING_DATASOURCE_USERNAME:librauser}
    password: ${SPRING_DATASOURCE_PASSWORD:librapassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
