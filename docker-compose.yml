version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: libravault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: libravault
      POSTGRES_USER: librauser
      POSTGRES_PASSWORD: librapassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librauser -d libravault"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - libravault-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: libravault-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/libravault
      SPRING_DATASOURCE_USERNAME: librauser
      SPRING_DATASOURCE_PASSWORD: librapassword
      LIBRAVAULT_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      LIBRAVAULT_JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - libravault-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: libravault-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    networks:
      - libravault-net

volumes:
  postgres_data:
    driver: local

networks:
  libravault-net:
    driver: bridge
