<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <linearGradient id="logo-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="logo-wing-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <linearGradient id="logo-wing-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <linearGradient id="logo-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>
  </defs>

  <!-- LOGO MARK -->
  <g transform="translate(4, 2)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#logo-bg)" stroke="url(#logo-stroke)" stroke-width="1.5" />

    <g transform="translate(-2, 0)">
      <!-- Left Manuscript Leaf -->
      <path d="M32 20C24 20 16 25 14 36C19 33 26 33 32 37V20Z" fill="url(#logo-wing-l)" />
      <path d="M32 20C24 20 16 25 14 36C19 33 26 33 32 37" stroke="#818CF8" stroke-width="1.2" stroke-linecap="round" />

      <!-- Right Manuscript Leaf -->
      <path d="M32 20C40 20 48 25 50 36C45 33 38 33 32 37V20Z" fill="url(#logo-wing-r)" />
      <path d="M32 20C40 20 48 25 50 36C45 33 38 33 32 37" stroke="#C084FC" stroke-width="1.2" stroke-linecap="round" />

      <!-- Lower Vault Foundation Keystones -->
      <path d="M20 42L32 49L44 42L32 45L20 42Z" fill="#4338CA" stroke="#6366F1" stroke-width="1" />

      <!-- Scales Horizon Beam -->
      <line x1="17" y1="21" x2="47" y2="21" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
      <circle cx="17" cy="21" r="2" fill="#38BDF8" />
      <circle cx="47" cy="21" r="2" fill="#A855F7" />

      <!-- Central Diamond Spark -->
      <path d="M32 9L36 17L32 25L28 17Z" fill="url(#logo-primary)" />
      <path d="M32 11L35 17L32 23L29 17Z" fill="#FFFFFF" fill-opacity="0.9" />
      <circle cx="32" cy="17" r="1.5" fill="#38BDF8" />
    </g>
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <g transform="translate(80, 0)">
    <!-- Brand Title -->
    <text x="0" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.03em" fill="url(#text-grad)">
      Libra<tspan fill="#818CF8">Vault</tspan>
    </text>

    <!-- Tagline Badge -->
    <rect x="0" y="44" width="88" height="15" rx="7.5" fill="#4F46E5" fill-opacity="0.2" stroke="#6366F1" stroke-width="0.8" />
    <text x="44" y="54.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.08em" fill="#A5B4FC">
      RESEARCH HUB
    </text>
  </g>
</svg>
