apiVersion: v1
kind: ConfigMap
metadata:
  name: libravault-config
  namespace: default
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/libravault"
  NEXT_PUBLIC_API_URL: "/api"
---
apiVersion: v1
kind: Secret
metadata:
  name: libravault-secrets
  namespace: default
type: Opaque
stringData:
  POSTGRES_DB: "libravault"
  POSTGRES_USER: "librauser"
  POSTGRES_PASSWORD: "librapassword"
  SPRING_DATASOURCE_USERNAME: "librauser"
  SPRING_DATASOURCE_PASSWORD: "librapassword"
  LIBRAVAULT_JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
